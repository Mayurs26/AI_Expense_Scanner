name: ai_expense_scanner
description: AI-powered offline-first expense tracker with receipt scanning and smart insights.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^14.6.2

  # Database (Drift ORM over SQLite)
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Auth
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0

  # OCR (Stage 2)
  google_mlkit_text_recognition: ^0.13.1

  # HTTP & AI
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1

  # Charts
  fl_chart: ^0.69.0

  # Animations
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilities
  share_plus: ^10.1.2
  connectivity_plus: ^6.1.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^3.0.3

  # Linting
  flutter_lints: ^4.0.0
  # Note: riverpod_lint and custom_lint removed — incompatible with analyzer 7.x used by drift_dev 2.x
  # Re-add after upgrading to drift_dev 2.35+ with compatible custom_lint

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/icons/
